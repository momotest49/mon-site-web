<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="locGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#16C784" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#063B2A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#063B2A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3324" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#041911" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="trajGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#063B2A" />
      <stop offset="50%" stop-color="#16C784" />
      <stop offset="100%" stop-color="#55EBB2" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#04150F" rx="20" />
  <circle cx="360" cy="220" r="280" fill="url(#locGlow)" />

  <!-- Stylized Geometric Map Grid -->
  <g opacity="0.16" stroke="#16C784" stroke-width="1.2">
    <!-- Main avenues -->
    <line x1="80" y1="260" x2="720" y2="200" stroke-width="2" />
    <line x1="320" y1="60" x2="420" y2="420" stroke-width="2" />
    <!-- Secondary grid -->
    <line x1="120" y1="160" x2="680" y2="120" />
    <line x1="140" y1="360" x2="700" y2="300" />
    <line x1="200" y1="60" x2="280" y2="420" />
    <line x1="480" y1="60" x2="580" y2="420" />
    <line x1="620" y1="60" x2="680" y2="420" />
    
    <!-- Concentric radar waves -->
    <circle cx="380" cy="230" r="60" fill="none" stroke-dasharray="4,4" />
    <circle cx="380" cy="230" r="120" fill="none" />
    <circle cx="380" cy="230" r="180" fill="none" stroke-dasharray="6,6" />
  </g>

  <!-- Trajectory Arc -->
  <path d="M 80 400 C 220 370, 310 270, 440 190 C 560 120, 670 90, 740 60" 
        fill="none" stroke="url(#trajGrad)" stroke-width="3.5" filter="url(#softGlow)" />

  <!-- Central Location Beacon Pinpoint -->
  <g transform="translate(350, 170)" filter="url(#softGlow)">
    <circle cx="30" cy="30" r="28" fill="#063B2A" stroke="#16C784" stroke-width="2.5" />
    <circle cx="30" cy="30" r="12" fill="#16C784" />
    <circle cx="30" cy="30" r="5" fill="#FFFFFF" />
  </g>

  <!-- Floating Local Business Verification Card -->
  <g transform="translate(80, 100)">
    <rect width="260" height="170" rx="16" fill="url(#cardGrad)" stroke="#16C784" stroke-opacity="0.4" stroke-width="1.2" />
    <rect x="20" y="20" width="130" height="24" rx="12" fill="#16C784" fill-opacity="0.15" />
    <text x="85" y="36" text-anchor="middle" fill="#16C784" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">OUAGADOUGOU &amp; BF</text>
    
    <text x="20" y="74" fill="#F7F8F4" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700">Trouvé au bon endroit</text>
    <text x="20" y="96" fill="#F7F8F4" opacity="0.75" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Recherche locale &amp; crédibilité</text>
    
    <!-- Stars -->
    <g transform="translate(20, 118)">
      <text x="0" y="16" fill="#FFC107" font-size="16">★★★★★</text>
      <text x="90" y="14" fill="#16C784" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">100% Vérifié</text>
    </g>
  </g>

  <!-- Impact Discovery Metric Floating Card -->
  <g transform="translate(460, 240)">
    <rect width="260" height="150" rx="16" fill="url(#cardGrad)" stroke="#16C784" stroke-opacity="0.35" stroke-width="1.2" />
    <circle cx="36" cy="40" r="16" fill="#16C784" fill-opacity="0.2" />
    <path d="M 30 40 L 35 45 L 43 35" stroke="#16C784" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="64" y="38" fill="#F7F8F4" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Présence Optimisée</text>
    <text x="64" y="56" fill="#F7F8F4" opacity="0.65" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Coordonnées &amp; Horaires clairs</text>
    
    <rect x="20" y="80" width="220" height="1" fill="#16C784" opacity="0.2" />
    <text x="20" y="104" fill="#16C784" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">+300% d'appels directs</text>
    <text x="20" y="124" fill="#F7F8F4" opacity="0.75" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Clients locaux rassurés</text>
  </g>
</svg>
