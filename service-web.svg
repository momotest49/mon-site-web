<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="webGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#16C784" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#063B2A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#063B2A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3324" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#041911" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="trajGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#063B2A" />
      <stop offset="50%" stop-color="#16C784" />
      <stop offset="100%" stop-color="#55EBB2" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#04150F" rx="20" />
  <circle cx="400" cy="220" r="280" fill="url(#webGlow)" />

  <!-- Trajectory Arc -->
  <path d="M 90 410 C 240 370, 360 250, 490 170 C 600 100, 690 70, 750 50" 
        fill="none" stroke="url(#trajGrad)" stroke-width="3.5" filter="url(#softGlow)" />

  <!-- Isometric / Floating Browser Frame -->
  <g transform="translate(100, 100)">
    <rect width="420" height="270" rx="16" fill="url(#cardGrad)" stroke="#16C784" stroke-opacity="0.5" stroke-width="1.5" />
    <!-- Browser Top Bar -->
    <rect width="420" height="38" rx="16" fill="#041810" />
    <circle cx="24" cy="19" r="5" fill="#D9534F" opacity="0.8" />
    <circle cx="40" cy="19" r="5" fill="#F0AD4E" opacity="0.8" />
    <circle cx="56" cy="19" r="5" fill="#16C784" opacity="0.8" />
    <!-- Search Bar -->
    <rect x="80" y="9" width="220" height="20" rx="10" fill="#092B1F" />
    <text x="190" y="23" text-anchor="middle" fill="#16C784" opacity="0.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">https://shift2.bf</text>

    <!-- Web Page Mockup Inside -->
    <g transform="translate(24, 56)">
      <!-- Mini hero -->
      <rect width="180" height="24" rx="4" fill="#16C784" fill-opacity="0.2" />
      <text x="12" y="16" fill="#F7F8F4" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Architecture Moderne</text>
      <rect y="34" width="240" height="6" rx="3" fill="#FFFFFF" opacity="0.2" />
      <rect y="46" width="180" height="6" rx="3" fill="#FFFFFF" opacity="0.1" />

      <!-- Columns -->
      <g transform="translate(0, 68)">
        <rect width="115" height="110" rx="8" fill="#07281B" stroke="#16C784" stroke-opacity="0.2" />
        <circle cx="25" cy="25" r="10" fill="#16C784" fill-opacity="0.3" />
        <rect x="15" y="45" width="80" height="6" rx="3" fill="#F7F8F4" opacity="0.7" />
        <rect x="15" y="58" width="60" height="5" rx="2" fill="#FFFFFF" opacity="0.3" />
        <rect x="15" y="80" width="70" height="16" rx="4" fill="#16C784" fill-opacity="0.3" />
      </g>

      <g transform="translate(130, 68)">
        <rect width="115" height="110" rx="8" fill="#07281B" stroke="#16C784" stroke-opacity="0.2" />
        <circle cx="25" cy="25" r="10" fill="#16C784" fill-opacity="0.3" />
        <rect x="15" y="45" width="80" height="6" rx="3" fill="#F7F8F4" opacity="0.7" />
        <rect x="15" y="58" width="60" height="5" rx="2" fill="#FFFFFF" opacity="0.3" />
        <rect x="15" y="80" width="70" height="16" rx="4" fill="#16C784" fill-opacity="0.3" />
      </g>
    </g>
  </g>

  <!-- Performance & Score Badge Floating on Right -->
  <g transform="translate(520, 110)">
    <rect width="200" height="160" rx="16" fill="url(#cardGrad)" stroke="#16C784" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="100" cy="55" r="32" fill="#041911" stroke="#16C784" stroke-width="3" />
    <text x="100" y="60" text-anchor="middle" fill="#16C784" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">100%</text>
    <text x="100" y="106" text-anchor="middle" fill="#F7F8F4" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Ultra-Rapide &amp; SEO</text>
    <text x="100" y="126" text-anchor="middle" fill="#F7F8F4" opacity="0.65" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Expérience Mobile &amp; Desktop</text>
  </g>

  <!-- Clean Floating Feature Card -->
  <g transform="translate(460, 300)">
    <rect width="250" height="100" rx="14" fill="url(#cardGrad)" stroke="#16C784" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="34" cy="38" r="14" fill="#16C784" fill-opacity="0.2" />
    <path d="M 28 38 L 32 42 L 40 34" stroke="#16C784" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="58" y="36" fill="#F7F8F4" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Design Sur Mesure</text>
    <text x="58" y="54" fill="#F7F8F4" opacity="0.65" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Pensé pour convertir</text>
    <text x="20" y="84" fill="#16C784" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Adapté à votre réalité</text>
  </g>
</svg>
