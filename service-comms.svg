<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="commGlow" cx="40%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#16C784" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#063B2A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#063B2A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3324" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#041911" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="trajGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#063B2A" />
      <stop offset="50%" stop-color="#16C784" />
      <stop offset="100%" stop-color="#55EBB2" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#04150F" rx="20" />
  <circle cx="360" cy="220" r="280" fill="url(#commGlow)" />

  <!-- Communication Reach Wave Rings -->
  <g opacity="0.18">
    <circle cx="560" cy="240" r="100" fill="none" stroke="#16C784" stroke-width="1.5" />
    <circle cx="560" cy="240" r="160" fill="none" stroke="#16C784" stroke-width="1.2" stroke-dasharray="6,6" />
    <circle cx="560" cy="240" r="230" fill="none" stroke="#16C784" stroke-width="1" />
  </g>

  <!-- Dynamic Trajectory Curve -->
  <path d="M 80 400 C 220 380, 320 260, 480 180 C 580 130, 680 100, 740 70" 
        fill="none" stroke="url(#trajGrad)" stroke-width="3.5" filter="url(#softGlow)" />

  <!-- Floating Smartphone & Content Ecosystem -->
  <g transform="translate(120, 90)">
    <!-- Phone Chassis -->
    <rect width="210" height="320" rx="30" fill="#0B261C" stroke="#16C784" stroke-width="1.8" />
    <!-- Notch -->
    <rect x="75" y="12" width="60" height="12" rx="6" fill="#04150F" />
    
    <!-- Screen Content: Brand Post Mockup -->
    <rect x="18" y="38" width="174" height="110" rx="14" fill="#073B29" />
    <circle cx="40" cy="62" r="14" fill="#16C784" fill-opacity="0.3" />
    <path d="M 35 62 L 45 62 M 40 57 L 40 67" stroke="#16C784" stroke-width="2" />
    <rect x="62" y="54" width="70" height="8" rx="4" fill="#F7F8F4" opacity="0.8" />
    <rect x="62" y="68" width="40" height="6" rx="3" fill="#16C784" />
    
    <!-- Content waveform -->
    <path d="M 30 115 Q 50 85 70 115 T 110 115 T 150 115 T 180 115" fill="none" stroke="#16C784" stroke-width="2" />
    
    <!-- Feed items -->
    <rect x="18" y="160" width="174" height="42" rx="10" fill="#051C14" stroke="#16C784" stroke-opacity="0.2" />
    <text x="32" y="184" fill="#F7F8F4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Stratégie Éditoriale</text>
    <rect x="140" y="174" width="38" height="16" rx="8" fill="#16C784" fill-opacity="0.2" />
    <text x="159" y="186" text-anchor="middle" fill="#16C784" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">+280%</text>

    <rect x="18" y="212" width="174" height="42" rx="10" fill="#051C14" stroke="#16C784" stroke-opacity="0.2" />
    <text x="32" y="236" fill="#F7F8F4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Présence &amp; Visibilité</text>

    <!-- Bottom Nav on Phone -->
    <circle cx="45" cy="285" r="5" fill="#16C784" />
    <circle cx="105" cy="285" r="5" fill="#FFFFFF" opacity="0.3" />
    <circle cx="165" cy="285" r="5" fill="#FFFFFF" opacity="0.3" />
  </g>

  <!-- Interactive Strategy Cards Floating to the Right -->
  <g transform="translate(420, 120)">
    <rect width="280" height="130" rx="16" fill="url(#cardGrad)" stroke="#16C784" stroke-opacity="0.4" stroke-width="1.2" />
    <rect x="20" y="20" width="140" height="24" rx="12" fill="#16C784" fill-opacity="0.15" />
    <text x="90" y="36" text-anchor="middle" fill="#16C784" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">IMAGE DE MARQUE</text>
    
    <text x="20" y="74" fill="#F7F8F4" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700">Communication Cohérente</text>
    <text x="20" y="96" fill="#F7F8F4" opacity="0.75" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Créer un lien de confiance durable</text>
  </g>

  <g transform="translate(460, 280)">
    <rect width="250" height="110" rx="16" fill="url(#cardGrad)" stroke="#16C784" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="36" cy="40" r="16" fill="#16C784" fill-opacity="0.18" />
    <path d="M 28 44 L 36 34 L 44 44" fill="none" stroke="#16C784" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="38" fill="#F7F8F4" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Audience Qualifiée</text>
    <text x="64" y="56" fill="#F7F8F4" opacity="0.65" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Des messages percutants</text>
    <rect x="20" y="80" width="210" height="1" fill="#16C784" opacity="0.2" />
    <text x="20" y="96" fill="#16C784" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Réseaux · Web · Médias</text>
  </g>
</svg>
