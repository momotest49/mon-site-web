<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="heroGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#16C784" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#063B2A" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#063B2A" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#041E15" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cardGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E8A57" />
      <stop offset="100%" stop-color="#16C784" />
    </linearGradient>

    <linearGradient id="lineGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#063B2A" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#16C784" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#55EBB2" stop-opacity="1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <rect width="900" height="700" fill="#041610" rx="24" />
  <circle cx="480" cy="340" r="320" fill="url(#heroGlow)" />

  <!-- Perspective grid floor -->
  <g opacity="0.18">
    <line x1="100" y1="620" x2="800" y2="620" stroke="#16C784" stroke-width="1" />
    <line x1="150" y1="560" x2="750" y2="560" stroke="#16C784" stroke-width="1" />
    <line x1="200" y1="510" x2="700" y2="510" stroke="#16C784" stroke-width="1" />
    <line x1="250" y1="470" x2="650" y2="470" stroke="#16C784" stroke-width="1" />
    
    <line x1="100" y1="620" x2="350" y2="440" stroke="#16C784" stroke-width="1" />
    <line x1="250" y1="620" x2="400" y2="440" stroke="#16C784" stroke-width="1" />
    <line x1="450" y1="620" x2="450" y2="440" stroke="#16C784" stroke-width="1" />
    <line x1="650" y1="620" x2="500" y2="440" stroke="#16C784" stroke-width="1" />
    <line x1="800" y1="620" x2="550" y2="440" stroke="#16C784" stroke-width="1" />
  </g>

  <!-- Kinetic Shift Trajectory Curves -->
  <path d="M 120 540 C 240 520, 320 460, 410 330 C 490 220, 620 160, 780 120" 
        fill="none" stroke="url(#lineGlow)" stroke-width="4" filter="url(#neonBlur)" />
  <path d="M 160 570 C 280 550, 360 480, 440 370 C 510 270, 640 200, 760 160" 
        fill="none" stroke="#16C784" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6,6" />

  <!-- Trajectory Nodes -->
  <circle cx="210" cy="510" r="4" fill="#16C784" />
  <circle cx="370" cy="380" r="6" fill="#16C784" filter="url(#neonBlur)" />
  <circle cx="560" cy="210" r="7" fill="#55EBB2" filter="url(#neonBlur)" />
  <circle cx="750" cy="130" r="9" fill="#FFFFFF" filter="url(#neonBlur)" />
  <circle cx="750" cy="130" r="18" fill="none" stroke="#16C784" stroke-width="1.5" opacity="0.6" />

  <!-- Isometric Glass Card 1: "Avant" (Complexity / Traditional) -->
  <g transform="translate(130, 330)" filter="url(#cardShadow)">
    <rect width="240" height="150" rx="16" fill="url(#cardGradDark)" stroke="#16C784" stroke-opacity="0.2" stroke-width="1" />
    <rect width="240" height="150" rx="16" fill="url(#cardGradLight)" />
    <!-- Header -->
    <circle cx="26" cy="28" r="6" fill="#D9534F" opacity="0.6" />
    <circle cx="44" cy="28" r="6" fill="#F0AD4E" opacity="0.6" />
    <circle cx="62" cy="28" r="6" fill="#5CB85C" opacity="0.6" />
    <text x="26" y="68" fill="#F7F8F4" opacity="0.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="1">MODE TRADITIONNEL</text>
    <text x="26" y="94" fill="#F7F8F4" opacity="0.9" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Outils dispersés</text>
    <rect x="26" y="112" width="120" height="6" rx="3" fill="#FFFFFF" opacity="0.15" />
    <rect x="26" y="124" width="80" height="6" rx="3" fill="#FFFFFF" opacity="0.1" />
  </g>

  <!-- Big Interactive Shift Indicator in Center -->
  <g transform="translate(390, 240)" filter="url(#cardShadow)">
    <rect width="120" height="120" rx="28" fill="#063B2A" stroke="#16C784" stroke-width="2" />
    <path d="M 45 75 L 75 45 M 50 45 L 75 45 L 75 70" fill="none" stroke="#16C784" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="105" text-anchor="middle" fill="#16C784" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="2">SHIFT²</text>
  </g>

  <!-- Isometric Glass Card 2: "Après" (Impact / Simplicity) -->
  <g transform="translate(530, 180)" filter="url(#cardShadow)">
    <rect width="280" height="190" rx="20" fill="url(#cardGradDark)" stroke="#16C784" stroke-width="1.5" />
    <rect width="280" height="190" rx="20" fill="url(#cardGradLight)" />
    
    <rect x="24" y="24" width="130" height="26" rx="13" fill="#16C784" fill-opacity="0.15" stroke="#16C784" stroke-width="1" />
    <text x="89" y="41" text-anchor="middle" fill="#16C784" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">MODE SHIFT² ACTIF</text>
    
    <text x="24" y="80" fill="#F7F8F4" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">Impact &amp; Clarté</text>
    <text x="24" y="104" fill="#F7F8F4" opacity="0.75" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Pratique · Utile · Durable</text>
    
    <rect x="24" y="128" width="232" height="8" rx="4" fill="#041E15" />
    <rect x="24" y="128" width="190" height="8" rx="4" fill="url(#accentGreen)" />
    
    <g transform="translate(24, 154)">
      <circle cx="6" cy="6" r="4" fill="#16C784" />
      <text x="18" y="10" fill="#F7F8F4" opacity="0.85" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Ouagadougou &amp; International</text>
    </g>
  </g>

  <!-- Floating Pills -->
  <g transform="translate(220, 190)" filter="url(#neonBlur)">
    <rect width="150" height="36" rx="18" fill="#063B2A" stroke="#16C784" stroke-width="1" />
    <text x="75" y="23" text-anchor="middle" fill="#F7F8F4" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Formation &amp; IA</text>
  </g>

  <g transform="translate(560, 430)">
    <rect width="180" height="38" rx="19" fill="#063B2A" stroke="#16C784" stroke-opacity="0.4" stroke-width="1" />
    <text x="90" y="24" text-anchor="middle" fill="#F7F8F4" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Outils Collaboratifs</text>
  </g>

  <g transform="translate(160, 520)">
    <rect width="160" height="36" rx="18" fill="#083827" stroke="#16C784" stroke-opacity="0.3" stroke-width="1" />
    <text x="80" y="23" text-anchor="middle" fill="#16C784" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Création Web</text>
  </g>

  <!-- Exponential Symbol accent -->
  <text x="780" y="580" fill="#16C784" opacity="0.08" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="180">²</text>
</svg>
