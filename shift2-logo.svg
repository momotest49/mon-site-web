<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGreenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7A4C" />
      <stop offset="50%" stop-color="#12A86B" />
      <stop offset="100%" stop-color="#16C784" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#063B2A" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- Lower Left Chevron Polygon -->
    <path d="M 180 230 L 245 160 L 275 190 L 215 255 L 245 255 L 230 280 L 180 280 Z" 
          fill="url(#logoGreenGrad)" stroke="#063B2A" stroke-width="6" stroke-linejoin="round" />
    <path d="M 190 235 L 245 175 L 265 195 L 215 250 L 240 250 L 230 270 L 195 270 Z" 
          fill="#16C784" opacity="0.6" />

    <!-- Upper Right Chevron with Arrow Head -->
    <path d="M 250 160 L 285 125 L 320 125 L 320 160 L 305 150 L 305 180 L 255 235 L 225 205 L 265 160 Z" 
          fill="url(#logoGreenGrad)" stroke="#063B2A" stroke-width="6" stroke-linejoin="round" />
    <!-- Arrow point details -->
    <polygon points="280,125 320,125 320,165 305,150 275,180 255,160 285,130" fill="url(#logoGreenGrad)" stroke="#063B2A" stroke-width="4" stroke-linejoin="round" />

    <!-- Wordmark SHIFT² in official styling -->
    <text x="235" y="360" text-anchor="middle" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="82" font-weight="900" 
          letter-spacing="-1"
          fill="#16C784" stroke="#0B5738" stroke-width="2">
      SHIFT
    </text>
    <!-- Exponent 2 -->
    <text x="365" y="320" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="46" font-weight="900" 
          fill="#0E7A4C">
      ²
    </text>
  </g>
</svg>
